<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Motorsport ID</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* ===== Navbar ===== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2c3e50;
      padding: 10px 20px;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar-left i {
      font-size: 20px;
      color: gray;
    }

    .navbar-left span {
      font-weight: bold;
      color: #00a651;
      font-size: 18px;
    }

    .navbar-right a, .logout-btn {
      text-decoration: none;
      color: #00a651;
      font-weight: bold;
      margin-left: 15px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .navbar-right a:hover, .logout-btn:hover {
      text-decoration: underline;
    }

    /* ===== Dashboard Content ===== */
    .dashboard-container {
      text-align: center;
      padding: 50px 20px;
    }

    .dashboard-container h1 {
      color: #2c3e50;
    }

    .welcome {
      font-size: 18px;
      color: #555;
      margin-top: 10px;
    }

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 250px;
      text-align: center;
    }

    .card h2 {
      color: #00a651;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
      margin: 0;
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      padding: 20px;
      background-color: #2c3e50;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-left">
      <i class="fas fa-tachometer-alt"></i>
      <span>Motorsport Dashboard</span>
    </div>
    <div class="navbar-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-container">
    <h1>Welcome to your Dashboard</h1>
    <p class="welcome">Hello, <span id="user-name"></span> 👋</p>

    <div class="stats">
      <div class="card">
        <h2>Orders</h2>
        <p>12 Completed</p>
      </div>
      <div class="card">
        <h2>Wishlist</h2>
        <p>5 Items Saved</p>
      </div>
      <div class="card">
        <h2>Messages</h2>
        <p>2 New</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 Motorsport ID. All rights reserved.</p>
  </footer>

  <!-- JS Login Check & Logout -->
  <script>
    // Cek apakah user sudah login
    const username = localStorage.getItem("username");

    if (!username) {
      alert("You must log in first!");
      window.location.href = "login.html";
    } else {
      document.getElementById("user-name").textContent = username;
    }

    function logout() {
      localStorage.removeItem("username");
      localStorage.removeItem("password");
      alert("You have been logged out!");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
